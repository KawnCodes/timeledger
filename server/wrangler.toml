name = "timeledger-sync"
main = "worker.mjs"
compatibility_date = "2025-06-01"

# Create the database with `npx wrangler d1 create timeledger` and paste its id below.
[[d1_databases]]
binding = "DB"
database_name = "timeledger"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Comma-separated list of app origins allowed to call the API, e.g. "https://you.github.io".
ALLOWED_ORIGINS = "*"
